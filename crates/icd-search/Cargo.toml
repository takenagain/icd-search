[package]
name = "icd-search"
version = "0.1.0"
edition = "2024"
description = "Client-side ICD-11 MMS search engine (BM25F, code match, typo tolerance) for WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
